<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Font Awesome (Icons) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Redaction+10:ital,wght@0,400;0,700;1,400&family=Roboto+Mono:ital,wght@0,100..700;1,100..700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="assets/css/style.css">
    <title>Iniguez Portfolio</title>
</head>
<body>
    <header>
        <h1>
            <a href="index.html" class="logo">II<span class="logo expand">niguez</span></a>
        </h1>

        <nav>
            <a href="index.html"> Home</a>
            <a href="about.html">About</a>
            <a href="projects.html" class="active">Projects</a>
            <a href="certs.html">Certificates</a>
        </nav>
    </header>

    <!-- project title -->
    <section class="about">
        <h1 class="about-content" id="project-title"></h1>
    </section>

    <!-- project summary -->
    <section class="about">
        <div class="about-content" id="project-summary">
            <!-- Brief summary will be inserted here -->
        </div> 
    </section>

    <!-- project content (iframe) -->
    <section class="about">
        <div id="project-content">
            <!-- Project HTML will be loaded here -->
        </div>
    </section>

    <script src="assets/js/projectsData.js"></script>

    <script>
    const projectName = new URLSearchParams(window.location.search).get("name");
    const project = projectData.find((item) => item.name === projectName);
    const title = document.getElementById("project-title");
    const summary = document.getElementById("project-summary");
    const content = document.getElementById("project-content");

    if (!project) {
        title.textContent = "Project not found";
        summary.hidden = true;
        content.textContent = "The requested project could not be found.";
    } else {
        // Set the document title and main title
        document.title = `${project.name} | Iniguez Portfolio`; // tab title
        // similar as in projectsData.js
        const titleText = document.createElement("span");
        titleText.textContent = project.name;
        title.appendChild(titleText);

        // Insert the summary if it exists
        if (project.summary) {
            // const summaryTitle = document.createElement("h2");
            // summaryTitle.textContent = "Summary";
            // summary.appendChild(summaryTitle);

            const summaryText = document.createElement("p");
            summaryText.classList.add("about-content");
            summaryText.insertAdjacentHTML("beforeend", project.summary);
            summary.appendChild(summaryText);

            // summary.insertAdjacentHTML("beforeend", project.summary);
        } else {
            summary.hidden = true;
        }

        // Insert the project content (html file) if it exists
        if (project.file) {
            const iframe = document.createElement("iframe");
            iframe.src = project.file;
            iframe.title = `${project.name} project content`;
            // iframe.width = "100%";
            iframe.width = "600";
            iframe.height = "750";
            iframe.style.border = "none";
            content.appendChild(iframe);
        } else {
                content.textContent = "Project content is unavailable.";
        }
    }
    </script>
</body>
</html>
